<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mantle Loader</title>
  <style>
    body {
      margin: 0;
      background: #09090b;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .loader {
      width: 130px;
      height: 2px;
      background: rgba(255,255,255,.08);
      border-radius: 999px;
      margin: 1rem auto;
      overflow: hidden;
    }
    .loader i {
      display: block;
      width: 40%;
      height: 100%;
      background: rgba(255,255,255,.5);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }
    pre {
      white-space: pre-wrap;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 1rem;
      max-width: 900px;
      color: #e4e4e7;
      font: 12px/1.6 monospace;
      margin-top: 1.5rem;
      text-align: left;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      padding: 10px 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"><i></i></div>
    <h1>Loading Mantle Menu…</h1>
    <button id="retryBtn">Retry</button>
    <pre id="content">Waiting for Mantle data…</pre>
  </div>

  <script>
    const content = document.getElementById('content');
    const retryBtn = document.getElementById('retryBtn');

    const fallbackUrls = [
      'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://mantle-menu.mantleunblocked.workers.dev'),
      'https://mantle-menu.mantleunblocked.workers.dev',
      'https://mantle-menu.mantleunblocked.workers.dev/'
    ];

    async function loadMantle() {
      content.textContent = 'Loading…';
      for (const url of fallbackUrls) {
        try {
          const res = await fetch(url, { 
            headers: { Accept: 'application/json, text/plain, */*' }
          });
          if (!res.ok) continue;
          const text = await res.text();
          if (text && text.trim()) {
            content.textContent = text;
            return;
          }
        } catch (e) {
          console.warn('Fallback failed:', url, e);
        }
      }
      content.textContent = 'Unable to load Mantle menu. All fallback URLs failed.';
    }

    retryBtn.addEventListener('click', loadMantle);
    loadMantle();
  </script>
</body>
</html>
